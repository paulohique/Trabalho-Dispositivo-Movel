<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Leitor de Gabarito OCR</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #fff; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; max-width: 500px; width: 100%; }
        h1 { color: #0056b3; }
        form { margin-top: 20px; }
        input[type="file"] { border: 1px solid #ccc; padding: 10px; border-radius: 4px; width: calc(100% - 22px); }
        button { background-color: #0056b3; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        button:hover { background-color: #004494; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Leitor de Gabarito OCR</h1>
        <p>Envie a imagem do gabarito (10 questões, 5 alternativas) para correção.</p>
        <form method="post" action="/upload" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <br>
            <button type="submit">Processar Gabarito</button>
        </form>
    </div>
</body>
</html>
