<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Resultado da Correção</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { background-color: #fff; padding: 30px 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h1 { color: #0056b3; }
        .error { color: #d93025; font-weight: bold; }
        .success { color: #1e8e3e; font-weight: bold; }
        ul { list-style-type: none; padding: 0; }
        li { background-color: #e9f5ff; border: 1px solid #cce5ff; margin-bottom: 8px; padding: 10px 15px; border-radius: 4px; font-size: 18px; display: flex; justify-content: space-between; }
        li span { font-weight: bold; }
        a { display: inline-block; margin-top: 20px; background-color: #0056b3; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
        a:hover { background-color: #004494; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resultado</h1>
        {% if error %}
            <p class="error">Erro: {{ error }}</p>
        {% else %}
            <p class="success">Respostas identificadas com sucesso!</p>
            <ul>
                {% for questao, resposta in respostas.items() %}
                    <li>Questão {{ questao }}: <span>{{ resposta }}</span></li>
                {% endfor %}
            </ul>
        {% endif %}
        <a href="/">Corrigir Outro Gabarito</a>
    </div>
</body>
</html>
